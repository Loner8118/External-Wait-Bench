version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
      - DELIVERY_MODE=parallel
      - REQUEST_TIMEOUT_MS=2000
      - MAX_RETRIES=3
      - RETRY_BASE_DELAY_MS=100
      - IDEMPOTENCY_TTL_SECONDS=3600
      - TARGET_A_URL=http://target-a:5000
      - TARGET_B_URL=http://target-b:5000
      - TARGET_C_URL=http://target-c:5000
      - TARGET_D_URL=http://target-d:5000
    depends_on:
      - redis
      - target-a
      - target-b
      - target-c
      - target-d
    restart: unless-stopped
    networks:
      - bench-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bench-network
    restart: unless-stopped

  target-a:
    build: 
      context: .
      dockerfile: mock-service.Dockerfile
    environment:
      - SERVICE_NAME=target-a
      - PORT=5000
      - LATENCY_MS=100
      - ERROR_RATE=0.01
      - TIMEOUT_RATE=0.0
    networks:
      - bench-network
    restart: unless-stopped

  target-b:
    build: 
      context: .
      dockerfile: mock-service.Dockerfile
    environment:
      - SERVICE_NAME=target-b
      - PORT=5000
      - LATENCY_MS=300
      - ERROR_RATE=0.03
      - TIMEOUT_RATE=0.01
    networks:
      - bench-network
    restart: unless-stopped

  target-c:
    build: 
      context: .
      dockerfile: mock-service.Dockerfile
    environment:
      - SERVICE_NAME=target-c
      - PORT=5000
      - LATENCY_MS=500
      - ERROR_RATE=0.05
      - TIMEOUT_RATE=0.02
    networks:
      - bench-network
    restart: unless-stopped

  target-d:
    build: 
      context: .
      dockerfile: mock-service.Dockerfile
    environment:
      - SERVICE_NAME=target-d
      - PORT=5000
      - LATENCY_MS=800
      - ERROR_RATE=0.10
      - TIMEOUT_RATE=0.05
    networks:
      - bench-network
    restart: unless-stopped

networks:
  bench-network:
    driver: bridge
